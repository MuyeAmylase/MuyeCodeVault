<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MuyeChat</title>
    <link rel="stylesheet" href="common.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            gap: 20px;
        }
        .page-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(135deg, #f7b731, #f39c12);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        .page-icon svg {
            width: 40px;
            height: 40px;
            color: #fff;
        }
        .page-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .page-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <a href="#" class="back-btn" title="返回" id="backBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="16 4 7 12 16 20"/>
            </svg>
        </a>
    </div>

    <div class="page-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
    </div>
    <h1 class="page-title">Note</h1>
    <p class="page-subtitle">AI 笔记工具 · 即将上线</p>

    <script>
        document.getElementById('backBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (document.referrer && document.referrer.includes(location.host)) {
                history.back();
            } else {
                location.href = 'more.html';
            }
        });
    </script>
</body>
</html>
