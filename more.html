<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MuyeCodeVault</title>
    <style>
        /* ========== 主题变量 ========== */
        :root {
            --bg-primary: #1a1a1f;
            --bg-card: #222228;
            --bg-card-hover: #282830;
            --text-primary: #e8e8ec;
            --text-secondary: #9a9aa6;
            --text-muted: #6b6b78;
            --border-card: #303038;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.4);
            --radius-sm: 8px;
            --radius-md: 12px;
            --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-primary: #f2f2f7;
                --bg-card: #ffffff;
                --bg-card-hover: #f5f5fa;
                --text-primary: #1c1c1e;
                --text-secondary: #6e6e73;
                --text-muted: #8e8e93;
                --border-card: #d1d1d6;
                --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.02);
                --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.04);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        /* 主容器 */
        .page-wrapper {
            width: 100%;
            max-width: 1100px;
            margin-top: 16px;
        }

        /* 顶部区域：返回按钮 + 标题 */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(20, 20, 26, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            outline: none;
            text-decoration: none;
            flex-shrink: 0;
        }
        .back-btn:hover {
            background: rgba(30,30,38,0.9);
            border-color: rgba(255,255,255,0.25);
            transform: scale(1.05);
        }
        .back-btn svg {
            width: 18px;
            height: 18px;
        }

        @media (prefers-color-scheme: light) {
            .back-btn {
                background: rgba(255, 255, 255, 0.72);
                border: 1px solid rgba(0, 0, 0, 0.1);
                color: #1c1c1e;
                box-shadow: 0 12px 40px rgba(0,0,0,0.06);
            }
            .back-btn:hover {
                background: rgba(230,230,235,0.9);
                border-color: rgba(0,0,0,0.18);
            }
        }

        .top-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.2px;
            line-height: 40px;
        }

        .section-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.4px;
            text-transform: uppercase;
            margin-bottom: 12px;
            padding-left: 4px;
        }

        /* 桌面端一行8个卡片 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .card-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .card-item:hover .card-icon-box {
            background: var(--bg-card-hover);
            border-color: var(--text-secondary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .card-item:active .card-icon-box {
            transform: scale(0.94);
        }
        a.card-item {
            text-decoration: none;
            color: inherit;
        }

        .card-icon-box {
            width: 50%;
            max-width: 80px;
            aspect-ratio: 1 / 1;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-sm);
            margin: 0 auto;
        }
        .card-icon-box svg {
            width: 36%;
            height: 36%;
            color: var(--text-secondary);
            transition: color 0.2s ease;
        }
        .card-item:hover .card-icon-box svg {
            color: var(--text-primary);
        }

        .card-label {
            margin-top: 10px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: 0.2px;
            line-height: 1.3;
        }

        /* 响应式调整 */
        @media (max-width: 900px) {
            .card-grid {
                grid-template-columns: repeat(6, 1fr);
            }
            .card-icon-box {
                width: 60%;
                max-width: 72px;
            }
        }

        @media (max-width: 768px) {
            .card-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
            }
            .top-title { font-size: 20px; }
            .section-label { font-size: 13px; }
            .card-label { font-size: 14px; }
            .card-icon-box {
                width: 60%;
                max-width: 72px;
            }
        }

        @media (max-width: 500px) {
            .card-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            .top-title { font-size: 18px; }
            .section-label { font-size: 12px; }
            .card-label { font-size: 13px; }
            .card-icon-box {
                width: 65%;
                max-width: 64px;
            }
        }

        @media (max-width: 380px) {
            .card-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .card-label { font-size: 12px; }
            .card-icon-box {
                width: 70%;
                max-width: 56px;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="top-bar">
            <button class="back-btn" id="backBtn" title="返回">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="16 4 7 12 16 20"/>
                </svg>
            </button>
            <span class="top-title">更多功能</span>
        </div>

        <div class="section-label">MuyeCodeVault 拓展功能</div>
        <div class="card-grid">
            <!-- 1. 表情包工作台 -->
            <a class="card-item" href="memes.html">
                <div class="card-icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                        <line x1="9" y1="9" x2="9.01" y2="9"/>
                        <line x1="15" y1="9" x2="15.01" y2="9"/>
                    </svg>
                </div>
                <span class="card-label">表情包工作台</span>
            </a>

            <!-- 2. 字体预览 -->
            <a class="card-item" href="font.html">
                <div class="card-icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 7 4 4 20 4 20 7"/>
                        <line x1="9" y1="20" x2="15" y2="20"/>
                        <line x1="12" y1="4" x2="12" y2="20"/>
                    </svg>
                </div>
                <span class="card-label">字体预览</span>
            </a>

            <!-- 3. 音乐 -->
            <a class="card-item" href="music.html">
                <div class="card-icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18V5l12-2v13"/>
                        <circle cx="6" cy="18" r="3"/>
                        <circle cx="18" cy="16" r="3"/>
                    </svg>
                </div>
                <span class="card-label">音乐</span>
            </a>

            <!-- 4. 世界书 -->
            <a class="card-item" href="worldbook.html">
                <div class="card-icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                </div>
                <span class="card-label">世界书</span>
            </a>

            <!-- 5. 设置 -->
            <a class="card-item" href="setting.html">
                <div class="card-icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </div>
                <span class="card-label">设置</span>
            </a>

            <!-- 6. 占位卡片 -->
            <div class="card-item">
                <div class="card-icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="3"/>
                        <line x1="9" y1="9" x2="15" y2="9"/>
                        <line x1="9" y1="13" x2="15" y2="13"/>
                        <line x1="9" y1="17" x2="12" y2="17"/>
                    </svg>
                </div>
                <span class="card-label">待开发</span>
            </div>

            <!-- 7. 占位卡片 -->
            <div class="card-item">
                <div class="card-icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <polyline points="12 7 12 12 15 15"/>
                    </svg>
                </div>
                <span class="card-label">待开发</span>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('backBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (document.referrer && document.referrer.includes(location.host)) {
                history.back();
            } else {
                location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
