<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MuyeCodeVault 更多功能</title>
    <style>
        /* ========== 主题变量 ========== */
        :root {
            --bg-primary: #1a1a1f;
            --bg-card: #222228;
            --bg-card-hover: #282830;
            --text-primary: #e8e8ec;
            --text-secondary: #9a9aa6;
            --text-muted: #6b6b78;
            --border-card: #303038;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.4);
            --radius-sm: 8px;
            --radius-md: 12px;
            --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-primary: #f2f2f7;
                --bg-card: #ffffff;
                --bg-card-hover: #f5f5fa;
                --text-primary: #1c1c1e;
                --text-secondary: #6e6e73;
                --text-muted: #8e8e93;
                --border-card: #d1d1d6;
                --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.02);
                --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.04);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        /* 主容器 */
        .page-wrapper {
            width: 100%;
            max-width: 900px;
            margin-top: 16px;
        }

        /* 顶部区域：返回按钮 + 标题 */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(20, 20, 26, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            outline: none;
            text-decoration: none;
            flex-shrink: 0;
        }
        .back-btn:hover {
            background: rgba(30,30,38,0.9);
            border-color: rgba(255,255,255,0.25);
            transform: scale(1.05);
        }
        .back-btn svg {
            width: 18px;
            height: 18px;
        }

        /* 浅色主题下的返回按钮 */
        @media (prefers-color-scheme: light) {
            .back-btn {
                background: rgba(255, 255, 255, 0.72);
                border: 1px solid rgba(0, 0, 0, 0.1);
                color: #1c1c1e;
                box-shadow: 0 12px 40px rgba(0,0,0,0.06);
            }
            .back-btn:hover {
                background: rgba(230,230,235,0.9);
                border-color: rgba(0,0,0,0.18);
            }
        }

        .top-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.2px;
            line-height: 40px; /* 与按钮高度一致 */
        }

        /* 分区小标题 */
        .section-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.4px;
            text-transform: uppercase;
            margin-bottom: 12px;
            padding-left: 4px;
        }

        /* 网格：桌面端一行六个 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        /* 卡片 */
        .card-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .card-item:hover .card-icon-box {
            background: var(--bg-card-hover);
            border-color: var(--text-secondary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .card-item:active .card-icon-box {
            transform: scale(0.94);
        }
        a.card-item {
            text-decoration: none;
            color: inherit;
         }

        /* 方形图标容器 */
        .card-icon-box {
            width: 50%;
            max-width: 80px;
            aspect-ratio: 1 / 1;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-sm);
            margin: 0 auto;
        }
        .card-icon-box svg {
            width: 36%;
            height: 36%;
            color: var(--text-secondary);
            transition: color 0.2s ease;
        }
        .card-item:hover .card-icon-box svg {
            color: var(--text-primary);
        }

        /* 卡片下方文字 */
        .card-label {
            margin-top: 10px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: 0.2px;
            line-height: 1.3;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .card-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
            }
            .top-title { font-size: 20px; }
            .section-label { font-size: 13px; }
            .card-label { font-size: 14px; }
            .card-icon-box {
                width: 60%;
                max-width: 72px;
            }
        }

        @media (max-width: 500px) {
            .card-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            .top-title { font-size: 18px; }
            .section-label { font-size: 12px; }
            .card-label { font-size: 13px; }
            .card-icon-box {
                width: 65%;
                max-width: 64px;
            }
        }

        @media (max-width: 380px) {
            .card-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .card-label { font-size: 12px; }
            .card-icon-box {
                width: 70%;
                max-width: 56px;
            }
        }
    </style>
</head>
