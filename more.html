<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>更多功能 · MuyeCodeVault</title>
    <style>
        :root {
            --bg-primary: #1a1a1f;
            --text-primary: #e8e8ec;
            --text-secondary: #9a9aa6;
            --text-muted: #6b6b78;
            --border-card: #303038;
            --bg-card: #222228;
            --bg-card-hover: #282830;
            --radius-sm: 8px;
            --radius-md: 12px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg-primary: #f2f2f7;
                --text-primary: #1c1c1e;
                --text-secondary: #6e6e73;
                --text-muted: #8e8e93;
                --border-card: #d1d1d6;
                --bg-card: #ffffff;
                --bg-card-hover: #f5f5fa;
                --shadow-sm: 0 2px 8px rgba(0,0,0,0.02);
            }
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            -webkit-font-smoothing: antialiased;
        }
        .icon { font-size: 56px; }
        .title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
        .subtitle { font-size: 14px; color: var(--text-secondary); }
        .back-link {
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }
        .back-link:hover {
            background: var(--bg-card-hover);
            border-color: var(--text-muted);
        }
        .back-link svg { width: 16px; height: 16px; }
    </style>
</head>
<body>
    <div class="icon">🚧</div>
    <div class="title">更多功能</div>
    <div class="subtitle">新功能即将上线，敬请期待</div>
    <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 4 7 12 16 20"/></svg>
        返回主页
    </a>
</body>
</html>
