<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MuyeChat</title>
    <style>
        :root {
            --bg-primary: #1a1a1f;
            --bg-card: #222228;
            --bg-card-hover: #282830;
            --text-primary: #e8e8ec;
            --text-secondary: #9a9aa6;
            --text-muted: #6b6b78;
            --border-card: #303038;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 6px 20px rgba(0,0,0,0.4);
            --accent: #8fb2c8;
            --danger: #e57373;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg-primary: #f2f2f7;
                --bg-card: #ffffff;
                --bg-card-hover: #f5f5fa;
                --text-primary: #1c1c1e;
                --text-secondary: #6e6e73;
                --text-muted: #8e8e93;
                --border-card: #d1d1d6;
                --shadow-sm: 0 2px 8px rgba(0,0,0,0.02);
                --accent: #5b8def;
            }
        }
        * { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    padding: 20px 20px 0;
}

.top-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    margin-bottom: 24px;
}
        .back-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: none; border: none; color: var(--text-primary);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.2s;
        }
        .back-btn:active { opacity: 0.5; }
        .back-btn svg { width: 22px; height: 22px; }
        .top-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }

        .search-bar {
            margin: 0 16px 8px; display: flex; align-items: center;
            background: var(--bg-card); border: 1px solid var(--border-card);
            border-radius: 8px; padding: 0 12px; height: 38px; flex-shrink: 0;
        }
        .search-icon {
            display: flex; align-items: center; margin-right: 8px;
            color: var(--text-muted); flex-shrink: 0;
        }
        .search-icon svg { width: 16px; height: 16px; }
        .search-bar input {
            flex:1; background:none; border:none; color:var(--text-primary);
            font-size:14px; outline:none;
        }
        .search-bar input::placeholder { color:var(--text-muted); }

.group-bar {
    display: flex; gap: 8px; padding: 8px 20px; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none; flex-shrink: 0;
    align-items: center;
}
        .group-bar::-webkit-scrollbar { display: none; }
        .group-chip {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border-card);
            background: var(--bg-card); color: var(--text-secondary); font-size: 13px;
            font-weight: 500; cursor: pointer; white-space: nowrap; flex-shrink: 0;
            transition: all 0.2s;
        }
        .group-chip.active {
            color: var(--text-primary); border-color: var(--text-muted);
            box-shadow: 0 0 0 2px rgba(143,178,200,0.15);
        }
        .chip-delete {
            display: inline-flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; border-radius: 50%; background: transparent;
            color: var(--danger); font-size: 14px; font-weight: bold; cursor: pointer;
            transition: transform 0.1s; line-height: 1;
        }
        .chip-delete:hover { transform: scale(1.2); }
        .add-group-chip {
            width: 34px; height: 34px; border-radius: 50%; border: 1px dashed var(--border-card);
            background: transparent; color: var(--text-muted); font-size: 18px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: all 0.2s;
        }
        .add-group-chip:active { border-color: var(--text-muted); color: var(--text-primary); }

        .content {
            flex:1; overflow-y:auto; padding:8px 16px 100px;
            display:flex; flex-direction:column; gap:10px;
        }
        .entry-card {
            background: var(--bg-card); border: 1px solid var(--border-card);
            border-radius: 10px; padding: 14px 16px; display: flex;
            flex-direction: column; gap: 8px; box-shadow: var(--shadow-sm);
            cursor: default; transition: transform 0.15s, background 0.15s;
        }
        .entry-card.pinned { border-left: 3px solid var(--accent); }
        .entry-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .entry-title { font-size: 16px; font-weight: 600; }
        .entry-content {
            font-size: 14px; color: var(--text-secondary);
            white-space: pre-wrap; line-height: 1.5;
            overflow: hidden; display: -webkit-box;
            -webkit-line-clamp: 3; -webkit-box-orient: vertical;
        }
        .entry-footer {
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid var(--border-card);
            padding-top: 8px; margin-top: 4px;
        }
        .entry-tags-text {
            font-size: 12px; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            flex: 1; min-width: 0;
        }
        .entry-actions {
            display: flex; gap: 16px; flex-shrink: 0; margin-left: 12px;
        }
        .text-btn {
            background: none; border: none; cursor: pointer; font-size: 12px;
            font-weight: 500; padding: 2px 0; color: var(--text-muted);
            transition: color 0.2s;
        }
        .text-btn:active { color: var(--text-primary); }
        .text-btn.pin-btn.pinned { color: var(--accent); }
        .text-btn.toggle-btn.enabled { color: var(--accent); }
        .text-btn.delete-btn { color: var(--danger); }

        .fab {
            position: fixed; right: 20px; bottom: calc(20px + var(--safe-bottom));
            width: 48px; height: 48px; border-radius: 50%;
            background: var(--bg-card); color: var(--text-primary);
            border: 1px solid var(--border-card);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-md); z-index: 10; transition: all 0.2s;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .fab:active { transform: scale(0.95); background: var(--bg-card-hover); }
        .fab svg { width: 24px; height: 24px; }

        .modal-overlay {
            position: fixed; inset:0; background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-overlay.hidden { display: none; }
        .modal-box {
            background: var(--bg-card); border: 1px solid var(--border-card);
            border-radius: 14px; padding: 24px; width: 90%; max-width: 400px;
            display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow-md);
            max-height: 85vh; overflow-y: auto;
        }
        .modal-box h3 { font-size: 18px; font-weight: 600; }
        .field-label {
            font-size: 12px; color: var(--text-muted);
            margin-bottom: 2px; font-weight: 500; letter-spacing: 0.3px;
        }
        .input-field {
            width: 100%; padding: 10px 12px; border: 1px solid var(--border-card);
            border-radius: 8px; background: var(--bg-primary); color: var(--text-primary);
            font-size: 14px; outline: none;
        }
        .input-field:focus { border-color: var(--accent); }
        textarea.input-field { min-height: 100px; resize: vertical; }
        .char-count {
            text-align: right; font-size: 11px; color: var(--text-muted);
            margin-top: 2px; padding-right: 4px;
        }

        .group-selector { position: relative; }
        .group-selector-display {
            padding: 10px 12px; border: 1px solid var(--border-card);
            border-radius: 8px; background: var(--bg-primary); color: var(--text-primary);
            font-size: 14px; cursor: pointer; display: flex; align-items: center;
            justify-content: space-between;
        }
        .group-dropdown {
            position: absolute; top: 100%; left: 0; right: 0;
            margin-top: 4px; background: var(--bg-card); border: 1px solid var(--border-card);
            border-radius: 8px; z-index: 150; max-height: 200px; overflow-y: auto;
            display: none; box-shadow: var(--shadow-md);
        }
        .group-dropdown.show { display: block; }
        .group-dropdown-item {
            padding: 10px 12px; cursor: pointer; font-size: 14px;
            color: var(--text-primary); transition: background 0.15s;
        }
        .group-dropdown-item:hover { background: var(--bg-card-hover); }

        .btn-save {
            background: var(--text-primary); color: var(--bg-primary);
            border: none; border-radius: 8px;
            padding: 10px 20px; font-weight: 600; cursor: pointer;
        }
        .btn-cancel {
            background: transparent; border: 1px solid var(--border-card);
            color: var(--text-primary); border-radius: 8px;
            padding: 10px 20px; font-weight: 500; cursor: pointer;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" id="backBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="16 4 7 12 16 20"/>
            </svg>
        </button>
        <span class="top-title">世界书</span>
    </div>

    <div class="search-bar">
        <span class="search-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </span>
        <input type="text" id="searchInput" placeholder="搜索词条..." oninput="renderEntries()">
    </div>

    <div class="group-bar" id="groupBar"></div>

    <div class="content" id="entryList"></div>

    <button class="fab" id="addEntryBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
    </button>

    <div class="modal-overlay hidden" id="groupModal">
        <div class="modal-box">
            <h3 id="groupModalTitle">新建分组</h3>
            <div>
                <div class="field-label">分组名称</div>
                <input class="input-field" id="groupNameInput" placeholder="例如：世界观">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeGroupModal()">取消</button>
                <button class="btn-save" id="saveGroupBtn">保存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="entryModal">
        <div class="modal-box">
            <h3 id="entryModalTitle">新词条</h3>
            <div>
                <div class="field-label">词条标题</div>
                <input class="input-field" id="entryTitle" placeholder="标题">
            </div>
            <div>
                <div class="field-label">所属分组</div>
                <div class="group-selector" id="groupSelector">
                    <div class="group-selector-display" id="groupDisplay">
                        <span id="groupDisplayText">默认分组</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                    </div>
                    <div class="group-dropdown" id="groupDropdown"></div>
                </div>
            </div>
            <div>
                <div class="field-label">正文内容</div>
                <textarea class="input-field" id="entryContent" placeholder="描述这个世界…"></textarea>
                <div class="char-count" id="charCount">共 0 字</div>
            </div>
            <div>
                <div class="field-label">标签（用逗号分隔）</div>
                <input class="input-field" id="entryTags" placeholder="例如：种族, 地理">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEntryModal()">取消</button>
                <button class="btn-save" id="saveEntryBtn">保存</button>
            </div>
        </div>
    </div>

<script src="db.js"></script>
<script>
    let groups = [];
    let activeGroupId = null;
    let entries = [];
    let editingGroupId = null;
    let editingEntryId = null;
    let selectedGroupId = '__default__';

    // ========== 分组管理（独立存储） ==========
    async function loadGroups() {
        // 从 settings 读取分组列表
        const saved = await MuyeDB.get('settings', 'worldbook_groups');
        if (saved && Array.isArray(saved.value)) {
            groups = saved.value;
        } else {
            // 首次使用：从现有词条中提取分组信息，保存为独立列表
            const allEntries = await MuyeDB.getAll('worldbook');
            const groupMap = new Map();
            (allEntries || []).forEach(e => {
                const gid = e.groupId || '__default__';
                const gname = e.groupName || '默认分组';
                if (!groupMap.has(gid)) groupMap.set(gid, gname);
            });
            groups = Array.from(groupMap, ([id, name]) => ({ id, name }));
            if (!groups.length) groups.push({ id: '__default__', name: '默认分组' });
            await MuyeDB.put('settings', { id: 'worldbook_groups', value: groups });
        }
        if (!activeGroupId || !groups.find(g => g.id === activeGroupId)) {
            activeGroupId = groups[0].id;
        }
        renderGroupBar();
        await loadEntries();
    }

    function renderGroupBar() {
        const bar = document.getElementById('groupBar');
        bar.innerHTML = groups.map(g => {
            const isDefault = g.id === '__default__';
            return `
            <div class="group-chip ${g.id === activeGroupId ? 'active' : ''}" 
                 data-group-id="${g.id}" 
                 onclick="switchGroup('${g.id}')"
                 oncontextmenu="event.preventDefault(); openEditGroup('${g.id}')">
                ${esc(g.name)}
                ${!isDefault ? `<span class="chip-delete" data-delete-group="${g.id}">&times;</span>` : ''}
            </div>`;
        }).join('') + `
            <div class="add-group-chip" onclick="openAddGroup()">+</div>
        `;

        // 重新绑定删除事件
        bar.querySelectorAll('.chip-delete').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteGroup(btn.dataset.deleteGroup);
            });
        });
    }

    function switchGroup(groupId) {
        activeGroupId = groupId;
        renderGroupBar();
        loadEntries();
    }

    function openAddGroup() {
        editingGroupId = null;
        document.getElementById('groupModalTitle').textContent = '新建分组';
        document.getElementById('groupNameInput').value = '';
        document.getElementById('groupModal').classList.remove('hidden');
    }

    function openEditGroup(groupId) {
        const group = groups.find(g => g.id === groupId);
        if (!group || group.id === '__default__') return;
        editingGroupId = groupId;
        document.getElementById('groupModalTitle').textContent = '编辑分组';
        document.getElementById('groupNameInput').value = group.name;
        document.getElementById('groupModal').classList.remove('hidden');
    }

    function closeGroupModal() {
        document.getElementById('groupModal').classList.add('hidden');
        editingGroupId = null;
    }

    async function saveGroup() {
        const name = document.getElementById('groupNameInput').value.trim();
        if (!name) return alert('请输入分组名称');
        if (editingGroupId) {
            const group = groups.find(g => g.id === editingGroupId);
            if (group) group.name = name;
            // 同步更新该分组下所有词条的 groupName
            const allEntries = await MuyeDB.getAll('worldbook');
            for (const e of (allEntries || [])) {
                if (e.groupId === editingGroupId) {
                    e.groupName = name;
                    await MuyeDB.put('worldbook', e);
                }
            }
        } else {
            const newId = 'g_' + Date.now();
            groups.push({ id: newId, name });
            activeGroupId = newId;
        }
        // 保存分组列表到 settings
        await MuyeDB.put('settings', { id: 'worldbook_groups', value: groups });
        closeGroupModal();
        await loadEntries();
        renderGroupBar();
    }

    async function deleteGroup(groupId) {
        if (groupId === '__default__') return;
        if (!confirm('删除分组将会同时删除该分组下的所有词条，确定吗？')) return;
        // 删除该分组下的所有词条
        const allEntries = await MuyeDB.getAll('worldbook');
        for (const e of (allEntries || [])) {
            if (e.groupId === groupId) {
                await MuyeDB.remove('worldbook', e.id);
            }
        }
        // 从分组列表中移除
        groups = groups.filter(g => g.id !== groupId);
        await MuyeDB.put('settings', { id: 'worldbook_groups', value: groups });
        if (activeGroupId === groupId) {
            activeGroupId = groups.length ? groups[0].id : '__default__';
        }
        renderGroupBar();
        await loadEntries();
    }

    // ========== 词条管理 ==========
    async function loadEntries() {
        const all = await MuyeDB.getAll('worldbook');
        entries = (all || []).filter(e => (e.groupId || '__default__') === activeGroupId)
                           .sort((a,b) => {
                               if (a.pinned && !b.pinned) return -1;
                               if (!a.pinned && b.pinned) return 1;
                               return b.createdAt - a.createdAt;
                           });
        renderEntries();
    }

    function renderEntries() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        const filtered = keyword
            ? entries.filter(e => e.title.toLowerCase().includes(keyword) || 
                                (e.tags||[]).some(t => t.toLowerCase().includes(keyword)))
            : entries;

        const list = document.getElementById('entryList');
        if (!filtered.length) {
            list.innerHTML = '<div style="text-align:center;color:var(--text-muted);margin-top:60px;">暂无词条</div>';
            return;
        }
        list.innerHTML = filtered.map(e => {
            const tagsStr = (e.tags || []).map(t => `#${t}`).join(' ');
            return `
            <div class="entry-card ${e.pinned ? 'pinned' : ''}" data-id="${e.id}">
                <div class="entry-header">
                    <div class="entry-title">${esc(e.title)}</div>
                </div>
                <div class="entry-content">${esc(e.content)}</div>
                <div class="entry-footer">
                    <div class="entry-tags-text">${tagsStr}</div>
                    <div class="entry-actions">
                        <button class="text-btn pin-btn ${e.pinned ? 'pinned' : ''}" data-pin="${e.id}">
                            ${e.pinned ? '已置顶' : '置顶'}
                        </button>
                        <button class="text-btn toggle-btn ${e.enabled !== false ? 'enabled' : ''}" data-toggle="${e.id}">
                            ${e.enabled !== false ? '已启用' : '启用'}
                        </button>
                        <button class="text-btn" data-edit="${e.id}">编辑</button>
                        <button class="text-btn delete-btn" data-delete="${e.id}">删除</button>
                    </div>
                </div>
            </div>
        `}).join('');

        list.querySelectorAll('[data-pin]').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); togglePin(btn.dataset.pin); });
        });
        list.querySelectorAll('[data-toggle]').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); toggleEnabled(btn.dataset.toggle); });
        });
        list.querySelectorAll('[data-edit]').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); openEditEntry(btn.dataset.edit); });
        });
        list.querySelectorAll('[data-delete]').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); deleteEntry(btn.dataset.delete); });
        });
    }

    async function togglePin(id) {
        const entry = entries.find(e => e.id == id);
        if (!entry) return;
        entry.pinned = !entry.pinned;
        await MuyeDB.put('worldbook', entry);
        await loadEntries();
    }

    async function toggleEnabled(id) {
        const entry = entries.find(e => e.id == id);
        if (!entry) return;
        entry.enabled = entry.enabled === false ? true : false;
        await MuyeDB.put('worldbook', entry);
        await loadEntries();
    }

    // ========== 弹窗内分组下拉 ==========
    function renderGroupDropdown() {
        const dropdown = document.getElementById('groupDropdown');
        dropdown.innerHTML = groups.map(g => `
            <div class="group-dropdown-item" data-gid="${g.id}">${esc(g.name)}</div>
        `).join('');
        dropdown.querySelectorAll('.group-dropdown-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                selectedGroupId = item.dataset.gid;
                const group = groups.find(g => g.id === selectedGroupId);
                document.getElementById('groupDisplayText').textContent = group ? group.name : '默认分组';
                dropdown.classList.remove('show');
            });
        });
    }

    function openGroupDropdown() {
        const dropdown = document.getElementById('groupDropdown');
        dropdown.classList.toggle('show');
        renderGroupDropdown();
    }

    document.getElementById('groupDisplay').addEventListener('click', (e) => {
        e.stopPropagation();
        openGroupDropdown();
    });
    document.addEventListener('click', (e) => {
        const dropdown = document.getElementById('groupDropdown');
        if (dropdown && !e.target.closest('#groupSelector')) {
            dropdown.classList.remove('show');
        }
    });

    // ========== 词条弹窗 + 字数统计 ==========
    const entryContentTextarea = document.getElementById('entryContent');
    const charCountDisplay = document.getElementById('charCount');
    entryContentTextarea.addEventListener('input', () => {
        const len = entryContentTextarea.value.length;
        charCountDisplay.textContent = `共 ${len} 字`;
    });

    function openAddEntry() {
        editingEntryId = null;
        document.getElementById('entryModalTitle').textContent = '新词条';
        document.getElementById('entryTitle').value = '';
        document.getElementById('entryContent').value = '';
        document.getElementById('entryTags').value = '';
        charCountDisplay.textContent = '共 0 字';
        selectedGroupId = activeGroupId;
        const group = groups.find(g => g.id === selectedGroupId) || { name: '默认分组' };
        document.getElementById('groupDisplayText').textContent = group.name;
        document.getElementById('entryModal').classList.remove('hidden');
    }

    function openEditEntry(id) {
        const entry = entries.find(e => e.id == id);
        if (!entry) return;
        editingEntryId = id;
        document.getElementById('entryModalTitle').textContent = '编辑词条';
        document.getElementById('entryTitle').value = entry.title;
        document.getElementById('entryContent').value = entry.content;
        document.getElementById('entryTags').value = (entry.tags||[]).join(', ');
        charCountDisplay.textContent = `共 ${entry.content.length} 字`;
        selectedGroupId = entry.groupId || '__default__';
        const group = groups.find(g => g.id === selectedGroupId) || { name: '默认分组' };
        document.getElementById('groupDisplayText').textContent = group.name;
        document.getElementById('entryModal').classList.remove('hidden');
    }

    function closeEntryModal() {
        document.getElementById('entryModal').classList.add('hidden');
        editingEntryId = null;
    }

    async function saveEntry() {
        const title = document.getElementById('entryTitle').value.trim();
        const content = document.getElementById('entryContent').value.trim();
        const tagsRaw = document.getElementById('entryTags').value.trim();
        if (!title) return alert('请输入标题');
        const tags = tagsRaw ? tagsRaw.split(/[,，]+/).map(t => t.trim()).filter(Boolean) : [];
        const group = groups.find(g => g.id === selectedGroupId) || { id: '__default__', name: '默认分组' };
        const existing = editingEntryId ? entries.find(e => e.id == editingEntryId) : null;
        const entry = {
            id: editingEntryId || 'wb_' + Date.now(),
            groupId: group.id,
            groupName: group.name,
            title,
            tags,
            content,
            pinned: existing ? existing.pinned : false,
            enabled: existing ? existing.enabled : true,
            createdAt: existing ? existing.createdAt : new Date().toISOString()
        };
        await MuyeDB.put('worldbook', entry);
        closeEntryModal();
        await loadEntries();
        await loadGroups();
    }

    async function deleteEntry(id) {
        if (!confirm('确定删除这个词条吗？')) return;
        await MuyeDB.remove('worldbook', id);
        await loadEntries();
    }

    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    // 事件绑定
    document.getElementById('addEntryBtn').addEventListener('click', openAddEntry);
    document.getElementById('saveEntryBtn').addEventListener('click', saveEntry);
    document.getElementById('saveGroupBtn').addEventListener('click', saveGroup);
    document.getElementById('entryModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeEntryModal(); });
    document.getElementById('groupModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeGroupModal(); });
document.getElementById('backBtn').addEventListener('click', function(e) {
        e.preventDefault();
        if (document.referrer && document.referrer.includes(location.host)) {
            history.back();
        } else {
            location.href = 'more.html';
        }
});

    loadGroups();
</script>
</body>
</html>
