<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MuyeChat · 世界书</title>
    <style>
        :root {
            /* 保留原世界书颜色主题 */
            --bg-primary: #1a1a1f;
            --bg-card: #222228;
            --bg-card-hover: #282830;
            --text-primary: #e8e8ec;
            --text-secondary: #9a9aa6;
            --text-muted: #6b6b78;
            --border-card: #303038;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 6px 20px rgba(0,0,0,0.4);
            --accent: #8fb2c8;
            --danger: #e57373;

            /* 统一设计系统变量（颜色继承原有） */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --safe-bottom: env(safe-area-inset-bottom, 16px);

            /* 输入框/搜索栏背景沿用卡片色 */
            --search-bg: var(--bg-card);
            --search-border: var(--border-card);
            --input-bg: var(--bg-primary);
            --input-border: var(--border-card);
            --btn-save-bg: #252525;
            --btn-save-border: #252525;
            --btn-save-text: #ffffff;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-primary: #f2f2f7;
                --bg-card: #ffffff;
                --bg-card-hover: #f5f5fa;
                --text-primary: #1c1c1e;
                --text-secondary: #6e6e73;
                --text-muted: #8e8e93;
                --border-card: #d1d1d6;
                --shadow-sm: 0 2px 8px rgba(0,0,0,0.02);
                --shadow-md: 0 6px 20px rgba(0,0,0,0.04);
                --accent: #5b8def;
                --search-bg: #ffffff;
                --search-border: #d1d1d6;
                --input-bg: #ffffff;
                --input-border: #d1d1d6;
                --btn-save-bg: #252525;
                --btn-save-border: #252525;
                --btn-save-text: #ffffff;
            }
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
            height: 100vh;            /* 新增，固定为视口高度 */
            overflow: hidden;         /* 新增，禁止 body 本身滚动 */
        }
.page-wrapper {
    width: 100%;
    max-width: 600px;
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    flex: 1;
    height: 100%;             /* 新增，继承 body 高度 */
    overflow: hidden;         /* 新增，防止溢出 */
}

        /* 顶部栏（与设置页统一） */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: background 0.2s;
            outline: none;
            flex-shrink: 0;
        }
        .back-btn:hover {
            background: rgba(128, 128, 128, 0.15);
        }
        .back-btn svg {
            width: 22px;
            height: 22px;
        }

        .top-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.2px;
            line-height: 40px;
        }

        /* 搜索栏（与设置页统一） */
        .search-bar {
            display: flex;
            align-items: center;
            background: var(--search-bg);
            border: 1px solid var(--search-border);
            border-radius: var(--radius-md);
            padding: 0 12px;
            height: 38px;
            gap: 8px;
            margin-bottom: 6px;
            box-shadow: var(--shadow-sm);
        }

        .search-icon {
            display: flex;
            align-items: center;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .search-icon svg {
            width: 16px;
            height: 16px;
        }

        .search-input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            min-width: 0;
        }
        .search-input::placeholder {
            color: var(--text-muted);
        }

        /* 分组栏 */
        .group-bar {
            display: flex;
            gap: 8px;
            padding: 8px 0;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            flex-shrink: 0;
            align-items: center;
            margin-bottom: 8px;
        }
        .group-bar::-webkit-scrollbar { display: none; }

        .group-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-card);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .group-chip.active {
            color: var(--text-primary);
            border-color: var(--text-muted);
            box-shadow: 0 0 0 2px rgba(143,178,200,0.15);
        }

        .chip-delete {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: transparent;
            color: var(--danger);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            line-height: 1;
        }
        .chip-delete:hover { transform: scale(1.2); }

        .add-group-chip {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px dashed var(--border-card);
            background: transparent;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .add-group-chip:active {
            border-color: var(--text-muted);
            color: var(--text-primary);
        }

        /* 词条列表容器 */
.content {
    flex: 1;
    min-height: 0;            /* 必须保留，允许收缩 */
    overflow-y: auto;         /* 已存在，确保是 auto */
    padding-bottom: 100px;    /* 已存在 */
    display: flex;
    flex-direction: column;
    gap: 10px;
}

        /* 词条卡片（卡片风格统一） */
        .entry-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: var(--shadow-sm);
            cursor: default;
            transition: transform 0.15s, background 0.15s;
        }
        .entry-card.pinned {
            border-left: 3px solid var(--accent);
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .entry-title {
            font-size: 16px;
            font-weight: 600;
        }

        .entry-content {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: pre-wrap;
            line-height: 1.5;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .entry-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-card);
            padding-top: 8px;
            margin-top: 4px;
        }

        .entry-tags-text {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }

        .entry-actions {
            display: flex;
            gap: 16px;
            flex-shrink: 0;
            margin-left: 12px;
        }

        .text-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            padding: 2px 0;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .text-btn:active { color: var(--text-primary); }
        .text-btn.pin-btn.pinned { color: var(--accent); }
        .text-btn.toggle-btn.enabled { color: var(--accent); }
        .text-btn.delete-btn { color: var(--danger); }

        /* FAB */
        .fab {
            position: fixed;
            right: 20px;
            bottom: calc(20px + var(--safe-bottom));
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
            z-index: 10;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .fab:active {
            transform: scale(0.95);
            background: var(--bg-card-hover);
        }
        .fab svg { width: 24px; height: 24px; }

        /* 通用按钮样式（与设置页统一） */
        .btn-primary,
        .btn-secondary,
        .btn-save,
        .btn-danger {
            width: 100%;
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, background 0.2s;
            outline: none;
            border: none;
            text-align: center;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover { opacity: 0.85; }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-card);
        }
        .btn-secondary:hover { background: var(--bg-card-hover); }

        .btn-save {
            background: var(--btn-save-bg);
            border: 1px solid var(--btn-save-border);
            color: var(--btn-save-text);
        }
        .btn-save:hover { opacity: 0.85; }

        .btn-danger {
            background: #d32f2f;
            color: #fff;
        }
        .btn-danger:hover { opacity: 0.85; }

        /* 模态框内按钮恢复自适应宽度 */
        .modal-actions .btn-secondary,
        .modal-actions .btn-save {
            width: auto;
            flex: 0 0 auto;
        }

        /* 模态弹窗（与设置页统一） */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal-dialog {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow-md);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        /* 表单标签与输入框 */
        .field-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            border-color: var(--accent);
        }
        textarea.form-input {
            min-height: 100px;
            resize: vertical;
        }

        .char-count {
            text-align: right;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            padding-right: 4px;
        }

        /* 分组选择器（复用预设选择器风格） */
        .preset-selector {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.2s;
            user-select: none;
        }
        .preset-selector:hover {
            border-color: var(--accent);
        }
        .preset-selector .preset-value {
            font-weight: 500;
        }
        .preset-selector .preset-arrow {
            width: 16px;
            height: 16px;
            color: var(--text-muted);
            transition: transform 0.2s;
        }
        .preset-selector.open .preset-arrow {
            transform: rotate(180deg);
        }

        .preset-dropdown {
            position: fixed;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-md);
            z-index: 99999;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }
        .preset-dropdown.show {
            display: block;
        }

        .preset-item {
            padding: 10px 12px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            transition: background 0.15s;
        }
        .preset-item:hover {
            background: var(--bg-card-hover);
        }
        .preset-item:first-child {
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        }
        .preset-item:last-child {
            border-radius: 0 0 var(--radius-sm) var(--radius-sm);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

.import-txt-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
}
</style>
</head>
<body>
<div class="page-wrapper">
    <!-- 顶部栏（与设置页完全相同的结构） -->
    <div class="top-bar">
        <button class="back-btn" id="backBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="16 4 7 12 16 20"/>
            </svg>
        </button>
        <span class="top-title">世界书</span>
    </div>

    <!-- 搜索栏（统一风格，无按钮） -->
    <div class="search-bar">
        <span class="search-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </span>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索词条..." oninput="renderEntries()">
    </div>

    <!-- 分组栏 -->
    <div class="group-bar" id="groupBar"></div>

    <!-- 词条列表 -->
    <div class="content" id="entryList"></div>
</div>

<!-- 添加词条 FAB -->
<button class="fab" id="addEntryBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
</button>

<!-- 分组编辑弹窗 -->
<div class="modal-overlay" id="groupModal">
    <div class="modal-dialog">
        <div class="modal-title" id="groupModalTitle">新建分组</div>
        <div>
            <div class="field-label">分组名称</div>
            <input class="form-input" id="groupNameInput" placeholder="例如：世界观">
        </div>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeGroupModal()">取消</button>
            <button class="btn-save" id="saveGroupBtn">保存</button>
        </div>
    </div>
</div>

<!-- 词条编辑弹窗 -->
<div class="modal-overlay" id="entryModal">
    <div class="modal-dialog">
        <div class="modal-title" id="entryModalTitle">新词条</div>
        <div>
            <div class="field-label">词条标题</div>
            <input class="form-input" id="entryTitle" placeholder="标题">
        </div>
        <div>
            <div class="field-label">所属分组</div>
            <div class="preset-selector" id="groupSelector">
                <span class="preset-value" id="groupDisplayText">默认分组</span>
                <svg class="preset-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </div>
            <div class="preset-dropdown" id="groupDropdown"></div>
        </div>
<div>
    <div class="field-label" style="display: flex; justify-content: space-between; align-items: center;">
        <span>正文内容</span>
        <button type="button" class="import-txt-btn" id="importTxtBtn">导入txt</button>
    </div>
    <textarea class="form-input" id="entryContent" placeholder="描述这个世界…"></textarea>
    <div class="char-count" id="charCount">共 0 字</div>
</div>
<!-- 隐藏的文件选择器 -->
<input type="file" id="importFileInput" accept=".txt" style="display: none;">
        <div>
            <div class="field-label">标签（用逗号分隔）</div>
            <input class="form-input" id="entryTags" placeholder="例如：种族, 地理">
        </div>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeEntryModal()">取消</button>
            <button class="btn-save" id="saveEntryBtn">保存</button>
        </div>
    </div>
</div>

<script src="db.js"></script>
<script>
    let groups = [];
    let activeGroupId = null;
    let entries = [];
    let editingGroupId = null;
    let editingEntryId = null;
    let selectedGroupId = '__default__';

    // ========== 分组管理 ==========
    async function loadGroups() {
        const saved = await MuyeDB.get('settings', 'worldbook_groups');
        if (saved && Array.isArray(saved.value)) {
            groups = saved.value;
        } else {
            const allEntries = await MuyeDB.getAll('worldbook');
            const groupMap = new Map();
            (allEntries || []).forEach(e => {
                const gid = e.groupId || '__default__';
                const gname = e.groupName || '默认分组';
                if (!groupMap.has(gid)) groupMap.set(gid, gname);
            });
            groups = Array.from(groupMap, ([id, name]) => ({ id, name }));
            if (!groups.length) groups.push({ id: '__default__', name: '默认分组' });
            await MuyeDB.put('settings', { id: 'worldbook_groups', value: groups });
        }
        if (!activeGroupId || !groups.find(g => g.id === activeGroupId)) {
            activeGroupId = groups[0].id;
        }
        renderGroupBar();
        await loadEntries();
    }

    function renderGroupBar() {
        const bar = document.getElementById('groupBar');
        bar.innerHTML = groups.map(g => {
            const isDefault = g.id === '__default__';
            return `
            <div class="group-chip ${g.id === activeGroupId ? 'active' : ''}" 
                 data-group-id="${g.id}" 
                 onclick="switchGroup('${g.id}')"
                 oncontextmenu="event.preventDefault(); openEditGroup('${g.id}')">
                ${esc(g.name)}
                ${!isDefault ? `<span class="chip-delete" data-delete-group="${g.id}">&times;</span>` : ''}
            </div>`;
        }).join('') + `
            <div class="add-group-chip" onclick="openAddGroup()">+</div>
        `;
        bar.querySelectorAll('.chip-delete').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteGroup(btn.dataset.deleteGroup);
            });
        });
    }

    function switchGroup(groupId) {
        activeGroupId = groupId;
        renderGroupBar();
        loadEntries();
    }

    function openAddGroup() {
        editingGroupId = null;
        document.getElementById('groupModalTitle').textContent = '新建分组';
        document.getElementById('groupNameInput').value = '';
        document.getElementById('groupModal').classList.add('active');
    }

    function openEditGroup(groupId) {
        const group = groups.find(g => g.id === groupId);
        if (!group || group.id === '__default__') return;
        editingGroupId = groupId;
        document.getElementById('groupModalTitle').textContent = '编辑分组';
        document.getElementById('groupNameInput').value = group.name;
        document.getElementById('groupModal').classList.add('active');
    }

    function closeGroupModal() {
        document.getElementById('groupModal').classList.remove('active');
        editingGroupId = null;
    }

    async function saveGroup() {
        const name = document.getElementById('groupNameInput').value.trim();
        if (!name) return alert('请输入分组名称');
        if (editingGroupId) {
            const group = groups.find(g => g.id === editingGroupId);
            if (group) group.name = name;
            const allEntries = await MuyeDB.getAll('worldbook');
            for (const e of (allEntries || [])) {
                if (e.groupId === editingGroupId) {
                    e.groupName = name;
                    await MuyeDB.put('worldbook', e);
                }
            }
        } else {
            const newId = 'g_' + Date.now();
            groups.push({ id: newId, name });
            activeGroupId = newId;
        }
        await MuyeDB.put('settings', { id: 'worldbook_groups', value: groups });
        closeGroupModal();
        await loadEntries();
        renderGroupBar();
    }

    async function deleteGroup(groupId) {
        if (groupId === '__default__') return;
        if (!confirm('删除分组将会同时删除该分组下的所有词条，确定吗？')) return;
        const allEntries = await MuyeDB.getAll('worldbook');
        for (const e of (allEntries || [])) {
            if (e.groupId === groupId) {
                await MuyeDB.remove('worldbook', e.id);
            }
        }
        groups = groups.filter(g => g.id !== groupId);
        await MuyeDB.put('settings', { id: 'worldbook_groups', value: groups });
        if (activeGroupId === groupId) {
            activeGroupId = groups.length ? groups[0].id : '__default__';
        }
        renderGroupBar();
        await loadEntries();
    }

    // ========== 词条管理 ==========
    async function loadEntries() {
        const all = await MuyeDB.getAll('worldbook');
        entries = (all || []).filter(e => (e.groupId || '__default__') === activeGroupId)
                           .sort((a,b) => {
                               if (a.pinned && !b.pinned) return -1;
                               if (!a.pinned && b.pinned) return 1;
                               return b.createdAt - a.createdAt;
                           });
        await renderEntries();
    }

    async function renderEntries() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        let filtered;
        if (keyword) {
            const allEntries = await MuyeDB.getAll('worldbook');
            const all = allEntries || [];
            filtered = all.filter(e => 
                e.title.toLowerCase().includes(keyword) ||
                (e.tags && Array.isArray(e.tags) && e.tags.some(t => t.toLowerCase().includes(keyword)))
            );
        } else {
            filtered = entries;
        }

        const list = document.getElementById('entryList');
        if (!filtered.length) {
            list.innerHTML = '<div style="text-align:center;color:var(--text-muted);margin-top:60px;">暂无词条</div>';
            return;
        }

        list.innerHTML = filtered.map(e => {
            const tagsStr = (e.tags || []).map(t => `#${t}`).join(' ');
            return `
            <div class="entry-card ${e.pinned ? 'pinned' : ''}" data-id="${e.id}">
                <div class="entry-header">
                    <div class="entry-title">${esc(e.title)}</div>
                </div>
                <div class="entry-content">${esc(e.content)}</div>
                <div class="entry-footer">
                    <div class="entry-tags-text">${tagsStr}</div>
                    <div class="entry-actions">
                        <button class="text-btn pin-btn ${e.pinned ? 'pinned' : ''}" data-pin="${e.id}">
                            ${e.pinned ? '已置顶' : '置顶'}
                        </button>
                        <button class="text-btn toggle-btn ${e.enabled !== false ? 'enabled' : ''}" data-toggle="${e.id}">
                            ${e.enabled !== false ? '已启用' : '启用'}
                        </button>
                        <button class="text-btn" data-edit="${e.id}">编辑</button>
                        <button class="text-btn" data-export="${e.id}">导出</button>
                        <button class="text-btn delete-btn" data-delete="${e.id}">删除</button>
                    </div>
                </div>
            </div>
        `}).join('');
    }

    // ========== 全局事件委托（修复导出点击无反应） ==========
    document.addEventListener('click', async (e) => {
        const target = e.target;

        // 导出按钮
        const exportBtn = target.closest('[data-export]');
        if (exportBtn) {
            e.stopPropagation();
            const id = exportBtn.dataset.export;
            console.log('触发导出，词条ID:', id);
            await exportEntry(id);
            return;
        }

        // 置顶按钮
        const pinBtn = target.closest('[data-pin]');
        if (pinBtn) {
            e.stopPropagation();
            await togglePin(pinBtn.dataset.pin);
            return;
        }

        // 启用按钮
        const toggleBtn = target.closest('[data-toggle]');
        if (toggleBtn) {
            e.stopPropagation();
            await toggleEnabled(toggleBtn.dataset.toggle);
            return;
        }

        // 编辑按钮
        const editBtn = target.closest('[data-edit]');
        if (editBtn) {
            e.stopPropagation();
            openEditEntry(editBtn.dataset.edit);
            return;
        }

        // 删除按钮
        const deleteBtn = target.closest('[data-delete]');
        if (deleteBtn) {
            e.stopPropagation();
            await deleteEntry(deleteBtn.dataset.delete);
            return;
        }
    });

    // 导出词条（字符串ID比较 + 详细日志）
    async function exportEntry(id) {
        console.log('开始导出，ID:', id, '类型:', typeof id);
        try {
            const allEntries = await MuyeDB.getAll('worldbook');
            console.log('数据库所有词条数量:', allEntries?.length);
            // 统一转为字符串比较
            const entry = (allEntries || []).find(e => String(e.id) === String(id));
            if (!entry) {
                console.error('未找到匹配词条，传入ID:', id, '数据库ID列表:', allEntries.map(e => e.id));
                alert('词条未找到，可能已被删除。请查看控制台获取详细信息。');
                return;
            }
            console.log('找到词条:', entry.title);
            const blob = new Blob([entry.content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (entry.title || '词条') + '.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            console.log('导出成功');
        } catch (err) {
            console.error('导出失败:', err);
            alert('导出失败：' + err.message);
        }
    }

    async function togglePin(id) {
        const entry = entries.find(e => e.id == id);
        if (!entry) return;
        entry.pinned = !entry.pinned;
        await MuyeDB.put('worldbook', entry);
        await loadEntries();
    }

    async function toggleEnabled(id) {
        const entry = entries.find(e => e.id == id);
        if (!entry) return;
        entry.enabled = entry.enabled === false ? true : false;
        await MuyeDB.put('worldbook', entry);
        await loadEntries();
    }

    // ========== 弹窗内分组下拉 ==========
    function renderGroupDropdown() {
        const dropdown = document.getElementById('groupDropdown');
        dropdown.innerHTML = groups.map(g => `
            <div class="preset-item" data-gid="${g.id}">${esc(g.name)}</div>
        `).join('');
        dropdown.querySelectorAll('.preset-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                selectedGroupId = item.dataset.gid;
                const group = groups.find(g => g.id === selectedGroupId);
                document.getElementById('groupDisplayText').textContent = group ? group.name : '默认分组';
                dropdown.classList.remove('show');
                document.getElementById('groupSelector').classList.remove('open');
            });
        });
    }

    function openGroupDropdown() {
        const dropdown = document.getElementById('groupDropdown');
        const selector = document.getElementById('groupSelector');
        renderGroupDropdown();
        const rect = selector.getBoundingClientRect();
        dropdown.style.top = (rect.bottom + 4) + 'px';
        dropdown.style.left = rect.left + 'px';
        dropdown.style.width = rect.width + 'px';
        dropdown.classList.add('show');
        selector.classList.add('open');
        if (dropdown.parentNode !== document.body) {
            document.body.appendChild(dropdown);
        }
    }

    // ========== 词条弹窗（新增/编辑） ==========
    const entryContentTextarea = document.getElementById('entryContent');
    const charCountDisplay = document.getElementById('charCount');
    entryContentTextarea.addEventListener('input', () => {
        charCountDisplay.textContent = `共 ${entryContentTextarea.value.length} 字`;
    });

    function openAddEntry() {
        editingEntryId = null;
        document.getElementById('entryModalTitle').textContent = '新词条';
        document.getElementById('entryTitle').value = '';
        document.getElementById('entryContent').value = '';
        document.getElementById('entryTags').value = '';
        charCountDisplay.textContent = '共 0 字';
        selectedGroupId = activeGroupId;
        const group = groups.find(g => g.id === selectedGroupId) || { name: '默认分组' };
        document.getElementById('groupDisplayText').textContent = group.name;
        document.getElementById('importTxtBtn').style.display = 'inline';
        document.getElementById('entryModal').classList.add('active');
    }

    function openEditEntry(id) {
        const entry = entries.find(e => e.id == id);
        if (!entry) return;
        editingEntryId = id;
        document.getElementById('entryModalTitle').textContent = '编辑词条';
        document.getElementById('entryTitle').value = entry.title;
        document.getElementById('entryContent').value = entry.content;
        document.getElementById('entryTags').value = (entry.tags||[]).join(', ');
        charCountDisplay.textContent = `共 ${entry.content.length} 字`;
        selectedGroupId = entry.groupId || '__default__';
        const group = groups.find(g => g.id === selectedGroupId) || { name: '默认分组' };
        document.getElementById('groupDisplayText').textContent = group.name;
        document.getElementById('importTxtBtn').style.display = 'none';
        document.getElementById('entryModal').classList.add('active');
    }

    function closeEntryModal() {
        document.getElementById('entryModal').classList.remove('active');
        editingEntryId = null;
    }

    async function saveEntry() {
        const title = document.getElementById('entryTitle').value.trim();
        const content = document.getElementById('entryContent').value.trim();
        const tagsRaw = document.getElementById('entryTags').value.trim();
        if (!title) return alert('请输入标题');
        const tags = tagsRaw ? tagsRaw.split(/[,，]+/).map(t => t.trim()).filter(Boolean) : [];
        const group = groups.find(g => g.id === selectedGroupId) || { id: '__default__', name: '默认分组' };
        const existing = editingEntryId ? entries.find(e => e.id == editingEntryId) : null;
        const entry = {
            id: editingEntryId || 'wb_' + Date.now(),
            groupId: group.id,
            groupName: group.name,
            title,
            tags,
            content,
            pinned: existing ? existing.pinned : false,
            enabled: existing ? existing.enabled : true,
            createdAt: existing ? existing.createdAt : new Date().toISOString()
        };
        await MuyeDB.put('worldbook', entry);
        closeEntryModal();
        await loadEntries();
        await loadGroups();
    }

    async function deleteEntry(id) {
        if (!confirm('确定删除这个词条吗？')) return;
        await MuyeDB.remove('worldbook', id);
        await loadEntries();
    }

    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    // ========== 导入 txt ==========
    document.getElementById('importTxtBtn').addEventListener('click', () => {
        document.getElementById('importFileInput').click();
    });

    document.getElementById('importFileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.name.toLowerCase().endsWith('.txt')) {
            alert('目前仅支持导入 .txt 文件');
            e.target.value = '';
            return;
        }
        const text = await file.text();
        const title = file.name.replace(/\.[^/.]+$/, "");
        document.getElementById('entryTitle').value = title;
        document.getElementById('entryContent').value = text;
        document.getElementById('charCount').textContent = `共 ${text.length} 字`;
        selectedGroupId = '__default__';
        const defaultGroup = groups.find(g => g.id === '__default__') || { name: '默认分组' };
        document.getElementById('groupDisplayText').textContent = defaultGroup.name;
        e.target.value = '';
    });

    // ========== 其他事件绑定 ==========
    document.getElementById('addEntryBtn').addEventListener('click', openAddEntry);
    document.getElementById('saveEntryBtn').addEventListener('click', saveEntry);
    document.getElementById('saveGroupBtn').addEventListener('click', saveGroup);
    document.getElementById('entryModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeEntryModal(); });
    document.getElementById('groupModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeGroupModal(); });

    document.getElementById('groupSelector').addEventListener('click', (e) => {
        e.stopPropagation();
        const dropdown = document.getElementById('groupDropdown');
        if (dropdown.classList.contains('show')) {
            dropdown.classList.remove('show');
            document.getElementById('groupSelector').classList.remove('open');
        } else {
            openGroupDropdown();
        }
    });

    document.addEventListener('click', (e) => {
        const dropdown = document.getElementById('groupDropdown');
        const selector = document.getElementById('groupSelector');
        if (dropdown && !selector.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.classList.remove('show');
            selector.classList.remove('open');
        }
    });

    document.getElementById('backBtn').addEventListener('click', function(e) {
        e.preventDefault();
        if (document.referrer && document.referrer.includes(location.host)) {
            history.back();
        } else {
            location.href = 'more.html';
        }
    });

    document.getElementById('searchInput').addEventListener('input', () => {
        renderEntries();
    });

    // 初始化
    loadGroups();
</script>
</body>
</html>
